# Cloud Build config for Madrasah ERP
# Build the Docker image and deploy the latest version to Cloud Run.
# If your Cloud Run service name or region is different, change the substitutions below.

substitutions:
  _SERVICE_NAME: madrasah-erp
  _REGION: asia-northeast1
  _IMAGE_NAME: madrasah-erp

steps:
  # Build the container image from the repo's Dockerfile
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$SHORT_SHA",
        "."
      ]

  # Push the image to Container Registry (gcr.io)
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$SHORT_SHA"
      ]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image",
        "gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$SHORT_SHA",
        "--region",
        "${_REGION}",
        "--platform",
        "managed",
        "--quiet",
        "--allow-unauthenticated"
      ]

images:
  - "gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$SHORT_SHA"
