<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0ea5e9" />
  <title>Super-Admin প্যানেল — Madrasah ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/platform/styles.css" />
  <script src="reload-splash.js"></script>
  <style>
    /* Ring/dot spinner CSS itself now lives in styles.css (so app.js's
       list-loading placeholders can reuse the same classes). Only the
       full-screen overlay positioning stays inline here, since it must
       be present before styles.css/app.js finish loading. */
    #reload-splash {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      align-items: center;
      justify-content: center;
      background: #f0f9ff;
      transition: opacity 0.35s ease;
    }
    .rs-reload #reload-splash {
      display: flex;
    }
    #reload-splash.rs-hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-loading">
      <div class="rs-orbit">
        <div class="rs-ring rs-ring--r1"></div>
        <div class="rs-ring rs-ring--r2">
          <span class="rs-dot"></span>
          <span class="rs-dot"></span>
          <span class="rs-dot"></span>
          <span class="rs-dot"></span>
        </div>
        <div class="rs-ring rs-ring--r3"></div>
        <div class="rs-ring rs-ring--r4"></div>
        <div class="rs-ring rs-ring--r5"></div>
      </div>
    </div>
  </div>
  <div id="reload-splash" aria-hidden="true">
    <div class="rs-orbit">
      <div class="rs-ring rs-ring--r1"></div>
      <div class="rs-ring rs-ring--r2">
        <span class="rs-dot"></span>
        <span class="rs-dot"></span>
        <span class="rs-dot"></span>
        <span class="rs-dot"></span>
      </div>
      <div class="rs-ring rs-ring--r3"></div>
      <div class="rs-ring rs-ring--r4"></div>
      <div class="rs-ring rs-ring--r5"></div>
    </div>
  </div>
  <script src="/platform/app.js"></script>
</body>
</html>
