# mosquitto-config/mosquitto.conf
# ============================================================================
# Minimal Mosquitto (MQTT broker) config for the local CCTV stack
# (docs/CCTV_INTEGRATION_PLAN.md, Phase 5). Frigate publishes detection
# events here; camera-bridge/ subscribes and forwards them to the website.
#
# Anonymous access is allowed because this broker only listens on the
# bridge machine's own local network (docker-compose.yml doesn't expose
# it beyond the bridge machine/its LAN) — it is NOT reachable from the
# internet. If you do expose port 1883 beyond your local network for any
# reason, set a username/password here first (see Mosquitto's own docs
# for `password_file`) and update MQTT_USERNAME/MQTT_PASSWORD in
# camera-bridge/.env to match.
# ============================================================================

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
